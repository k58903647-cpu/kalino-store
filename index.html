<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>کالینو | فروشگاه لوازم جانبی موبایل</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
:root{--p:#2563eb;--dark:#0f172a;--bg:#f6f8fb;--card:#fff;--muted:#64748b;--border:#e5e7eb;--ok:#10b981;--danger:#ef4444}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#111827;font-family:Vazirmatn,Arial,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.wrap{max-width:1200px;margin:auto;padding:0 18px}.header{background:#fff;position:sticky;top:0;z-index:20;border-bottom:1px solid var(--border)}.nav{height:68px;display:flex;align-items:center;gap:18px}.logo{font-size:25px;font-weight:800;color:var(--p);cursor:pointer}.search{flex:1;max-width:520px}.search input{width:100%;border:1px solid var(--border);border-radius:30px;padding:12px 18px;outline:0;background:#f8fafc}.actions{margin-right:auto;display:flex;gap:8px}.btn{border:0;border-radius:10px;padding:10px 16px}.primary{background:var(--p);color:#fff}.ghost{background:#eef2ff;color:#1e40af}.danger{background:#fee2e2;color:#b91c1c}.cat{background:#fff;border-bottom:1px solid var(--border)}.cats{display:flex;gap:8px;overflow:auto;padding:10px 0}.chip{border:0;background:#f1f5f9;border-radius:22px;padding:8px 15px;white-space:nowrap}.chip.active{background:#dbeafe;color:#1d4ed8}.hero{margin:24px 0;background:linear-gradient(120deg,#0f172a,#1d4ed8);border-radius:22px;padding:38px;color:white;display:flex;justify-content:space-between;align-items:center}.hero h1{font-size:34px;margin:0 0 10px}.hero p{color:#cbd5e1}.hero .orb{font-size:75px}.section-title{display:flex;justify-content:space-between;align-items:center;margin:28px 0 14px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.product{background:#fff;border:1px solid var(--border);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}.pic{height:210px;background:#f8fafc;display:flex;align-items:center;justify-content:center;font-size:70px}.pic img{width:100%;height:100%;object-fit:contain}.info{padding:14px}.title{font-weight:600;min-height:52px}.price{font-weight:800;font-size:18px;margin-top:8px}.old{text-decoration:line-through;color:#94a3b8;font-size:12px;margin-right:8px}.stock{font-size:12px;color:var(--muted);margin:5px 0 10px}.footer{margin-top:50px;background:var(--dark);color:#cbd5e1;padding:35px 0}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:18px;z-index:50}.modal.show{display:flex}.box{background:#fff;border-radius:18px;max-width:900px;width:100%;max-height:90vh;overflow:auto;padding:22px}.row{display:flex;gap:10px}.field{margin:10px 0}.field label{display:block;font-size:13px;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;padding:11px;border:1px solid var(--border);border-radius:9px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid var(--border);text-align:right;font-size:13px}.admin-nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.stat{padding:16px;background:#f8fafc;border:1px solid var(--border);border-radius:14px}.stat b{display:block;font-size:23px;margin-top:5px}.admin-product{border:1px solid var(--border);padding:12px;border-radius:12px;margin:8px 0}.admin-product .row>*{flex:1}.empty{text-align:center;color:var(--muted);padding:45px}.close{float:left;background:#f1f5f9;border:0;border-radius:8px;padding:5px 10px;font-size:20px}@media(max-width:900px){.grid{grid-template-columns:repeat(3,1fr)}.cards{grid-template-columns:repeat(2,1fr)}.hero .orb{display:none}}@media(max-width:600px){.nav{height:auto;padding:12px 0;flex-wrap:wrap}.search{order:3;max-width:none;flex-basis:100%}.hero{padding:25px}.hero h1{font-size:25px}.grid{grid-template-columns:repeat(2,1fr);gap:10px}.pic{height:150px}.actions .btn{padding:8px}.box{padding:15px}.row{flex-direction:column}}
</style></head><body><div id="app"></div><div id="modal" class="modal"></div><script>
const $=s=>document.querySelector(s),fmt=n=>Number(n).toLocaleString('fa-IR')+' تومان';let state={products:[],cats:[],cart:JSON.parse(localStorage.kalinoCart||'[]'),user:null,category:'',q:''};
async function api(url,opt={}){let r=await fetch(url,{headers:{'Content-Type':'application/json',...(opt.headers||{})},...opt});let d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'خطا');return d}
async function load(){[state.products,state.cats,state.user]=await Promise.all([api('/api/products'),api('/api/categories'),api('/api/auth/me').catch(()=>null)]);render()}
function render(){document.body.innerHTML=body();if(location.hash==='#admin'&&state.user?.role==='admin')adminPage();else mainPage()}
function body(){return `<header class="header"><div class="wrap nav"><div class="logo" onclick="location.hash='';load()">کالینو</div><div class="search"><input value="${esc(state.q)}" placeholder="جستجوی کالا..." onkeydown="if(event.key==='Enter'){state.q=this.value;loadProducts()}"></div><div class="actions"><button class="btn ghost" onclick="openCart()">🛒 سبد (${state.cart.reduce((a,x)=>a+x.qty,0)})</button>${state.user?`<button class="btn" onclick="${state.user.role==='admin'?"location.hash='admin';adminPage()":"orders()"}">حساب من</button><button class="btn danger" onclick="logout()">خروج</button>`:`<button class="btn primary" onclick="login()">ورود</button>`}</div></div></header><div class="cat"><div class="wrap cats"><button class="chip ${!state.category?'active':''}" onclick="state.category='';loadProducts()">همه</button>${state.cats.map(c=>`<button class="chip ${state.category===c.category?'active':''}" onclick="state.category='${esc(c.category)}';loadProducts()">${esc(c.category)}</button>`).join('')}</div></div><main class="wrap" id="content"></main><footer class="footer"><div class="wrap"><b>کالینو</b> — فروشگاه لوازم جانبی موبایل<br><small>مدیریت کامل فروشگاه از پنل مدیریت</small></div></footer>`}
function mainPage(){ $('#content').innerHTML=`<section class="hero"><div><h1>کالینو؛ لوازم جانبی موبایل</h1><p>خرید ساده، قیمت شفاف و مدیریت حرفه‌ای فروشگاه.</p><button class="btn primary" onclick="document.getElementById('products').scrollIntoView()">مشاهده کالاها</button></div><div class="orb">📱</div></section><div class="section-title"><h2 id="products">محصولات</h2><span>${state.products.length} کالا</span></div><div class="grid">${state.products.length?state.products.map(card).join(''):`<div class="empty">کالایی پیدا نشد.</div>`}</div>`}
function card(p){return `<article class="product"><div class="pic">${p.image?`<img src="${p.image}">`:'📦'}</div><div class="info"><div class="title">${esc(p.title)}</div><div class="stock">موجودی: ${p.stock}</div><div class="price">${fmt(p.price)} ${p.old_price?`<span class="old">${fmt(p.old_price)}</span>`:''}</div><button class="btn primary" style="width:100%;margin-top:10px" onclick="add(${p.id})" ${p.stock<1?'disabled':''}>${p.stock?'افزودن به سبد':'ناموجود'}</button></div></article>`}
async function loadProducts(){state.products=await api('/api/products?q='+encodeURIComponent(state.q)+'&category='+encodeURIComponent(state.category));render()}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function add(id){let x=state.cart.find(x=>x.product_id===id);if(x)x.qty++;else state.cart.push({product_id:id,qty:1});localStorage.kalinoCart=JSON.stringify(state.cart);render();openCart()}
function openModal(html){$('#modal').innerHTML=`<div class="box"><button class="close" onclick="$('#modal').classList.remove('show')">×</button>${html}</div>`;$('#modal').classList.add('show')}
function openCart(){openModal(`<h2>سبد خرید</h2>${state.cart.length?state.cart.map(x=>{let p=state.products.find(p=>p.id===x.product_id);return p?`<div class="admin-product"><b>${esc(p.title)}</b><div class="row"><span>${fmt(p.price)}</span><input type="number" min="1" max="${p.stock}" value="${x.qty}" onchange="cartQty(${p.id},this.value)"><button class="btn danger" onclick="removeCart(${p.id})">حذف</button></div></div>`:''}).join(''):`<div class="empty">سبد خرید خالی است.</div>`}<div style="margin-top:15px"><button class="btn primary" onclick="checkout()" ${!state.cart.length?'disabled':''}>ادامه و ثبت سفارش</button></div>`) }
function cartQty(id,v){let x=state.cart.find(x=>x.product_id===id);if(x)x.qty=Math.max(1,Number(v)||1);localStorage.kalinoCart=JSON.stringify(state.cart);openCart()}function removeCart(id){state.cart=state.cart.filter(x=>x.product_id!==id);localStorage.kalinoCart=JSON.stringify(state.cart);openCart()}
function login(){openModal(`<h2>ورود به کالینو</h2><div class="field"><label>ایمیل</label><input id="em"></div><div class="field"><label>رمز عبور</label><input id="pw" type="password"></div><button class="btn primary" onclick="doLogin()">ورود</button><button class="btn" onclick="register()">ثبت‌نام</button>`) }async function doLogin(){try{await api('/api/auth/login',{method:'POST',body:JSON.stringify({email:$('#em').value,password:$('#pw').value})});$('#modal').classList.remove('show');await load()}catch(e){alert(e.message)}}function register(){openModal(`<h2>ثبت‌نام</h2><div class="field"><label>نام</label><input id="nm"></div><div class="field"><label>ایمیل</label><input id="em"></div><div class="field"><label>رمز</label><input id="pw" type="password"></div><button class="btn primary" onclick="doRegister()">ساخت حساب</button>`)}async function doRegister(){try{await api('/api/auth/register',{method:'POST',body:JSON.stringify({name:$('#nm').value,email:$('#em').value,password:$('#pw').value})});$('#modal').classList.remove('show');await load()}catch(e){alert(e.message)}}async function logout(){await api('/api/auth/logout',{method:'POST'});state.user=null;location.hash='';load()}
function checkout(){if(!state.user)return login();openModal(`<h2>ثبت سفارش</h2><div class="field"><label>نام و نام خانوادگی</label><input id="on" value="${esc(state.user.name)}"></div><div class="field"><label>شماره موبایل</label><input id="ph" placeholder="09..."></div><div class="field"><label>آدرس کامل</label><textarea id="ad"></textarea></div><button class="btn primary" onclick="submitOrder()">ثبت سفارش</button>`)}async function submitOrder(){try{let d=await api('/api/orders',{method:'POST',body:JSON.stringify({name:$('#on').value,phone:$('#ph').value,address:$('#ad').value,items:state.cart})});state.cart=[];localStorage.removeItem('kalinoCart');alert('سفارش با موفقیت ثبت شد. شماره سفارش: '+d.id);$('#modal').classList.remove('show');await load()}catch(e){alert(e.message)}}async function orders(){let os=await api('/api/orders');openModal(`<h2>سفارش‌های من</h2>${os.map(o=>`<div class="admin-product">سفارش #${o.id} — ${fmt(o.total)} — وضعیت: ${esc(o.status)}</div>`).join('')||'<div class="empty">هنوز سفارشی ندارید.</div>'}`)}
async function adminPage(){if(!state.user||state.user.role!=='admin')return login();document.body.innerHTML=adminShell();await adminDashboard()}
function adminShell(){return `<div class="wrap" style="padding-top:25px"><div class="section-title"><h1>پنل مدیریت کالینو</h1><button class="btn" onclick="location.hash='';load()">بازگشت به فروشگاه</button></div><div class="admin-nav"><button class="btn primary" onclick="adminDashboard()">داشبورد</button><button class="btn" onclick="adminProducts()">کالاها</button><button class="btn" onclick="adminOrders()">سفارش‌ها</button><button class="btn" onclick="adminUsers()">کاربران</button><button class="btn" onclick="adminSettings()">تنظیمات</button></div><div id="adminContent"></div></div>`}
async function adminDashboard(){let s=await api('/api/admin/stats');$('#adminContent').innerHTML=`<div class="cards">${[['کالاها',s.products],['سفارش‌ها',s.orders],['فروش',fmt(s.revenue)],['مشتری‌ها',s.customers],['موجودی کم',s.lowStock]].map(x=>`<div class="stat">${x[0]}<b>${x[1]}</b></div>`).join('')}</div><div class="section-title"><h2>شروع سریع</h2></div><p>از بخش «کالاها» محصول اضافه یا ویرایش کن و از «سفارش‌ها» وضعیت سفارش‌ها را مدیریت کن.</p>`}
async function adminProducts(){let ps=await api('/api/admin/products');$('#adminContent').innerHTML=`<button class="btn primary" onclick="productForm()">+ افزودن کالا</button><div>${ps.map(p=>`<div class="admin-product"><div class="row"><b>${esc(p.title)}</b><span>${fmt(p.price)}</span><span>موجودی: ${p.stock}</span><button class="btn ghost" onclick='productForm(${JSON.stringify(p)})'>ویرایش</button><button class="btn danger" onclick="delProduct(${p.id})">حذف</button></div></div>`).join('')}</div>`}
function productForm(p={}){openModal(`<h2>${p.id?'ویرایش':'افزودن'} کالا</h2><input type="hidden" id="pid" value="${p.id||''}"><div class="field"><label>عنوان</label><input id="pt" value="${esc(p.title||'')}"></div><div class="field"><label>توضیحات</label><textarea id="pd">${esc(p.description||'')}</textarea></div><div class="row"><div class="field"><label>قیمت</label><input id="pp" type="number" value="${p.price||0}"></div><div class="field"><label>قیمت قبلی</label><input id="po" type="number" value="${p.old_price||0}"></div><div class="field"><label>موجودی</label><input id="ps" type="number" value="${p.stock||0}"></div></div><div class="row"><div class="field"><label>دسته‌بندی</label><input id="pc" value="${esc(p.category||'لوازم جانبی موبایل')}"></div><div class="field"><label>آدرس عکس (اختیاری)</label><input id="pi" value="${esc(p.image||'')}"></div></div><button class="btn primary" onclick="saveProduct()">ذخیره</button>`)}async function saveProduct(){let id=$('#pid').value;let d={title:$('#pt').value,description:$('#pd').value,price:$('#pp').value,old_price:$('#po').value,stock:$('#ps').value,category:$('#pc').value,image:$('#pi').value,active:1};try{await api(id?'/api/admin/products/'+id:'/api/admin/products',{method:id?'PUT':'POST',body:JSON.stringify(d)});$('#modal').classList.remove('show');adminProducts()}catch(e){alert(e.message)}}async function delProduct(id){if(confirm('این کالا حذف شود؟')){await api('/api/admin/products/'+id,{method:'DELETE'});adminProducts()}}
async function adminOrders(){let os=await api('/api/admin/orders');$('#adminContent').innerHTML=`<table class="table"><tr><th>شماره</th><th>مشتری</th><th>مبلغ</th><th>وضعیت</th><th>تغییر</th></tr>${os.map(o=>`<tr><td>#${o.id}</td><td>${esc(o.name)}<br>${esc(o.phone)}</td><td>${fmt(o.total)}</td><td>${esc(o.status)}</td><td><select onchange="changeOrder(${o.id},this.value)"><option ${o.status==='pending'?'selected':''} value="pending">در انتظار</option><option ${o.status==='processing'?'selected':''} value="processing">در حال پردازش</option><option ${o.status==='shipped'?'selected':''} value="shipped">ارسال شد</option><option ${o.status==='delivered'?'selected':''} value="delivered">تحویل شد</option><option ${o.status==='cancelled'?'selected':''} value="cancelled">لغو</option></select></td></tr>`).join('')}</table>`}async function changeOrder(id,status){await api('/api/admin/orders/'+id,{method:'PUT',body:JSON.stringify({status})})}
async function adminUsers(){let us=await api('/api/admin/users');$('#adminContent').innerHTML=`<table class="table"><tr><th>نام</th><th>ایمیل</th><th>نقش</th><th>ثبت‌نام</th></tr>${us.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td>${u.role}</td><td>${u.created_at}</td></tr>`).join('')}</table>`}async function adminSettings(){let s=await api('/api/settings');$('#adminContent').innerHTML=`<h2>تنظیمات فروشگاه</h2><div class="field"><label>نام فروشگاه</label><input id="sn" value="${esc(s.store_name||'کالینو')}"></div><div class="field"><label>شماره تماس</label><input id="sp" value="${esc(s.phone||'')}"></div><div class="field"><label>متن فوتر</label><textarea id="sf">${esc(s.footer||'فروشگاه کالینو')}</textarea></div><button class="btn primary" onclick="saveSettings()">ذخیره تنظیمات</button>`}async function saveSettings(){await api('/api/admin/settings',{method:'PUT',body:JSON.stringify({store_name:$('#sn').value,phone:$('#sp').value,footer:$('#sf').value})});alert('ذخیره شد')}
load();</script></body></html>
